name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            documentation/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Le build régénère routeTree.gen.ts, que le typecheck et les tests lisent.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # La documentation (hopla.page/docs), un projet Next à part dans documentation/.
      - run: pnpm --dir documentation install --frozen-lockfile
      - run: pnpm --dir documentation build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
