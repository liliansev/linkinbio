name: linkinbio
services:
  app:
    container_name: linkinbio-app
    image: ${APP_IMAGE:?tested image required}
    restart: unless-stopped
    init: true
    read_only: true
    env_file:
      - path: /opt/linkinbio/secrets/runtime.env
        format: raw
    environment:
      NODE_ENV: production
      PORT: '3000'
      # L'API du site de Lilian (dernière vidéo, newsletter), par le réseau `edge`.
      LIENS_SITE: http://liliansevoumian-app:3000
    # La base SQLite : seul endroit inscriptible. On reprend le volume du site
    # pour garder les comptes, les blocs et les stats (voir deploy/README.md).
    volumes:
      - liens-data:/data
    networks:
      - ingress
    ports:
      - '127.0.0.1:3101:3000'
    mem_limit: 256m
    cpus: 0.50
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
volumes:
  liens-data:
    external: true
    name: liliansevoumian_liens-data
networks:
  ingress:
    external: true
    # Frontal HTTPS partagé : /opt/edge (Caddy), upstream linkinbio-app:3000.
    name: edge
