# Hopla as a single service, for self-hosting: Coolify, Dokploy, or any server
# with Docker Compose. Point to the repository URL, set the two required
# variables, deploy. Guide: docs/SELF-HOSTING.md.
# (The hopla.page production stack is deploy/compose.yaml.)
services:
  hopla:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      NODE_ENV: production
      PORT: '3000'
      # Required. Public URL of the instance, including https:// (pages at /<username>, admin panel at /admin),
      # and the administrator email address.
      LIENS_ORIGINE: ${LIENS_ORIGINE:?public URL of the instance, for example https://links.example.org}
      LIENS_ADMIN_EMAIL: ${LIENS_ADMIN_EMAIL:?administrator email address}
      # Username of the administrator page.
      LIENS_PSEUDO_PRINCIPAL: ${LIENS_PSEUDO_PRINCIPAL:-moi}
      # Optional: admin panel on another hostname (https://app.links.example.org). Empty: same hostname.
      LIENS_ORIGINE_ADMIN: ${LIENS_ORIGINE_ADMIN:-}
      # Recommended: sign-in emails. Without it, only the administrator can sign in, using the link written to the logs.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_FROM: ${CONTACT_FROM:-}
      # Recommended: encrypts API credentials and subscribers (openssl rand -base64 32). Never change it once set.
      LIENS_CLE_INTEGRATIONS: ${LIENS_CLE_INTEGRATIONS:-}
      # Legal notice of an instance open to the public.
      LIENS_EDITEUR: ${LIENS_EDITEUR:-}
      LIENS_HEBERGEUR: ${LIENS_HEBERGEUR:-}
      LIENS_DIRECTEUR: ${LIENS_DIRECTEUR:-}
      LIENS_CONTACT_LEGAL: ${LIENS_CONTACT_LEGAL:-}
      # Empty: open sign-up. "attente": waitlist, invitations sent from the Comptes (Accounts) tab.
      LIENS_INSCRIPTION: ${LIENS_INSCRIPTION:-}
      # Your fork, if you modified the code (AGPL-3.0): target of the "Code source" link.
      LIENS_DEPOT_SOURCE: ${LIENS_DEPOT_SOURCE:-}
    # SQLite database and uploaded images: the entire instance state, back it up.
    volumes:
      - hopla-data:/data
    # Coolify and Dokploy route their domain and HTTPS to port 3000. On a bare server, publish this port
    # behind an HTTPS reverse proxy (see the guide).
    expose:
      - '3000'
volumes:
  hopla-data:
